<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Video</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    main { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
    video { display: block; width: 100%; max-height: 100vh; max-height: 100dvh; object-fit: contain; background: #000; }
    .actions { position: fixed; z-index: 2; top: 14px; right: 14px; display: flex; gap: 10px; }
    button { background: #242424; color: white; border: 1px solid #999; border-radius: 12px; padding: 12px 16px; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #383838; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <video id="video" autoplay muted playsinline controls preload="auto" aria-label="Video">
      <source src="video.mp4" type="video/mp4">
      Your browser does not support MP4 playback.
    </video>
  </main>
  <div class="actions">
    <button type="button" id="play" hidden>▶ Play video</button>
    <button type="button" id="sound">🔊 Enable sound</button>
  </div>
  <script>
    const video = document.getElementById('video');
    const play = document.getElementById('play');
    const sound = document.getElementById('sound');
    async function startVideo() {
      try {
        await video.play();
        play.hidden = true;
      } catch (error) {
        // If autoplay is blocked, a person can start it with one click.
        play.hidden = false;
      }
    }
    play.addEventListener('click', startVideo);
    video.addEventListener('playing', () => { play.hidden = true; });
    sound.addEventListener('click', async () => {
      video.muted = false;
      sound.hidden = true;
      await startVideo();
    });
    startVideo();
  </script>
</body>
</html>
